name: Nix checks

# push chỉ chạy trên main để PR nội bộ không bị chạy đôi (push + pull_request)
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v20

      # Kiểm tra định dạng (sử dụng nixfmt-rfc-style đã cấu hình trong flake)
      - name: Check Nix format
        run: nix fmt -- --check

      # Kiểm tra tính hợp lệ của flake (bỏ qua build)
      - name: Check Nix flake
        run: nix flake check --no-build