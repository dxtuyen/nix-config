# Cấu hình Yazi — CỐ Ý TỐI GIẢN.
# Yazi tự merge file này với config mặc định, nên chỉ khai những gì thật sự
# muốn đổi. Thêm mục mới ở đây hoàn toàn an toàn.
#
# Nguồn chính thức: https://yazi.rs/docs/configuration/yazi

[opener]
# Thoát yazi: dùng đường dẫn tuyệt đối, không phụ thuộc $SHELL/PATH khi
# khởi chạy từ Sway (sway không set shell).
edit = [
	{ run = 'alacritty --title "nvim" -e nvim', block = false, desc = "Edit" },
]

[mgr]
# Ảnh nền nằm ở ~/Pictures/wallpapers — YÊN TĨNH, không tự đổi ảnh đại diện
# (Yazi mặc định sort theo natural, còn đây ép alphabetical cho ổn định).
# Giá trị hợp lệ: none|mtime|btime|extension|alphabetical|natural|size|random
sort_by = "alphabetical"
sort_dir = true
ratio = [1, 2, 3, 4, 5, 6, 7, 8, 9]

# Sắp xếp file trước thư mục, ẩn file ẩn.
sort_layout = "mixed"
show_hidden = false

[preview]
# Xem trước ảnh ngay khi duyệt ~/Pictures/wallpapers.
# wrap chỉ nhận "no" | "yes".
wrap = "no"

[task]
# Đoán sẵn thư mục mở lần đầu (mỗi lần chạy).
micro_workers = 8
macro_workers = 4

# Không tạo file backup khi ghi (làm nhiễu thư mục ảnh).
skip_confirm = false
