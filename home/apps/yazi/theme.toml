# Theme Yazi — Catppuccin Mocha, khớp Foot (home/config/foot.nix) và Sway (home/config/sway.nix).
#
# File này CHỈ ghi đè 13 khoá có NỀN MÀU. Đó là nhóm duy nhất bị hỏng, vì:
#
#   • Yazi mặc định tô bằng TÊN MÀU ANSI: `fg="white", bg="green"`.
#     Cách đó giả định bảng màu kiểu cổ điển: white=#ffffff, green=xanh TỐI.
#   • Bảng Mocha thì cả 8 màu ANSI đều là PASTEL SÁNG → "chữ trắng"
#     thành #bac2de, "nền xanh" thành #a6e3a1 → chữ sáng đè lên nền sáng.
#
# Đo bằng công thức tương phản WCAG trên nền terminal #1e1e2e (chuẩn ≥ 4.5:1).
#
# Màu CHỮ đơn lẻ (tên file, viền khung, từ khoá tìm kiếm) thì KHÔNG ghi:
# mọi màu ANSI Mocha trên nền tối đều ≥ 4.5:1 nên vốn đã an toàn.
# Ô tick `marker_*` cũng để nguyên — fg==bg nên thực chất là khối đặc, không
# phải chữ nên không dính lỗi tương phản.

[mgr]
# Badge đếm file (đã copy / đã cut / đang chọn) — chữ TỐI trên nền màu
count_copied   = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
count_cut      = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }
count_selected = { fg = "#1e1e2e", bg = "#fab387", bold = true }

[mode]
# ⭐ Thanh trạng thái ở giữa dưới — nhìn liên tục nên dùng nền TỐI MỜ +
# chữ SÁNG: dịu mắt mà vẫn rõ (thay vì nền xanh dương chữ trắng như mặc định).
normal_main = { bg = "#313244", fg = "#cdd6f4", bold = true }
normal_alt  = { bg = "#313244", fg = "#89b4fa" }

# Chế độ đang tick file (Space): nền ĐỎ + chữ TỐI — cố ý nổi bật vì đây là
# trạng thái cần nhận ra ngay. V (unset) dùng chung bảng màu.
select_main = { bg = "#f38ba8", fg = "#1e1e2e", bold = true }
select_alt  = { bg = "#313244", fg = "#f38ba8" }
unset_main  = { bg = "#f38ba8", fg = "#1e1e2e", bold = true }
unset_alt   = { bg = "#313244", fg = "#f38ba8" }

[status]
# Thanh tiến trình copy/move ở góc dưới
progress_normal = { fg = "#a6e3a1", bg = "#1e1e2e" }
progress_error  = { fg = "#f38ba8", bg = "#1e1e2e" }

[tabs]
active   = { bg = "#89b4fa", fg = "#1e1e2e", bold = true }
inactive = { fg = "#89b4fa", bg = "#11111b" }
